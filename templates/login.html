<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 가맹점 관리 시스템</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 30px; color: #0f172a; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>가맹점 관리 시스템</h1>
        <input type="text" id="username" placeholder="아이디" autocapitalize="none" autocorrect="off" spellcheck="false" onkeypress="if(event.keyCode==13) doLogin()">
        <input type="password" id="password" placeholder="비밀번호" onkeypress="if(event.keyCode==13) doLogin()">
        <button onclick="doLogin()">로그인</button>
    </div>
    <script>
        function doLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') location.href = '/';
                else alert(data.message);
            });
        }
    </script>
</body>
</html>
